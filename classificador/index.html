<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Classificador de Herói</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Classificador de Herói</h2>

    <label for="nome">Nome do Herói:</label>
    <input type="text" id="nome">

    <label for="xp">XP do Herói:</label>
    <input type="number" id="xp">

    <button id="btnClassificar">Classificar</button>

    <div class="resultado" id="resultado"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
